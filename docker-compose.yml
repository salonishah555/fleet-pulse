services:
  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:4200,http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm start -- --host 0.0.0.0 --port 4200"
    depends_on:
      - backend
    ports:
      - "8080:4200"
    volumes:
      - ./frontend/fleet-pulse-ui:/app
